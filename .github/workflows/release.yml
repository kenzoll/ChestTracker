name: Build and publish Chest Tracker
on:
  push:
    branches: [main]
    paths: ['src/**', '.github/workflows/release.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: chest-tracker-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Publish single EXE
        shell: pwsh
        run: |
          dotnet publish src/ChestTracker.csproj -c Release -o publish -m:1 -p:UseSharedCompilation=false
          if ($LASTEXITCODE -ne 0) { throw 'Build failed' }
      - name: Run checks
        shell: pwsh
        run: |
          $p = Start-Process -FilePath (Join-Path $PWD 'publish/ChestTracker.exe') -ArgumentList '--self-test','checks.txt' -Wait -PassThru
          Get-Content checks.txt
          if ($p.ExitCode -ne 0) { throw 'Checks failed' }
      - name: Publish stable release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [xml]$project = Get-Content src/ChestTracker.csproj
          $version = [string]$project.Project.PropertyGroup.Version
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'Invalid version' }
          $tag = 'v' + $version
          $release = gh release view $tag --json tagName 2>$null
          if ($LASTEXITCODE -eq 0) { Write-Host 'Release already exists'; exit 0 }
          @'
          Обновление Chest Tracker 4.1. Один EXE, без установки.
          Автоматическая загрузка обновлений с проверкой контрольной суммы; установка при закрытии приложения.
          История матчей и настройки сохраняются.
          '@ | Set-Content release-notes.md -Encoding utf8
          $binary = Get-Item publish/ChestTracker.exe
          $checksum = (Get-FileHash $binary.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          $downloadUrl = 'https://github.com/' + $env:GITHUB_REPOSITORY + '/releases/download/' + $tag + '/ChestTracker.exe'
          @{ draft=$false; prerelease=$false; tag_name=$tag; assets=@(@{name='ChestTracker.exe';size=$binary.Length;digest=('sha256:'+$checksum);browser_download_url=$downloadUrl}) } | ConvertTo-Json -Depth 5 | Set-Content publish/update.json -Encoding utf8
          gh release create $tag publish/ChestTracker.exe publish/update.json --target $env:GITHUB_SHA --title 'Chest Tracker 4.1' --notes-file release-notes.md --latest
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
